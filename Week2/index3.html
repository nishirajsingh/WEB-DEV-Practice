<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form</title>
</head>
<body>
    <div>
        <h1>Student data collection</h1>
        <form>
            <label for="fname">Enter Name:</label>
            <input type="text" name="fname" placeholder="Nishiraj"><br>
            <label for="email">Enter Email:</label>
            <input type="mail" name="email" placeholder="nishiraj@gmail.com"><br>
            <label for="password">Enter password:</label>
            <input type="password" name="password"><br>
            <label for="dob">Enter DOB:</label>
            <input type="date" name="dob" placeholder="01-01-1990">
            <br>
            <input type="checkbox" name="sign">
            <label for="sign">Keep me signed in</label>
            <br>
            <button type="submit">Submit</button>
            <button type="reset">Clear</button>

        </form>
    </div>
    
</body>
</html>
