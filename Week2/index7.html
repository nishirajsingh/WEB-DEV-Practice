<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Student data</title>
    <style>
        table,td,th{

            border-collapse:collapse;
            padding: 10px;

        }

        }

        }
        .fail p{

            background-color: rgba(255, 140, 140, 0.916);

        }
    </style>
</head>
