<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Style</title>
    <style>
        table{
            border: 5px solid blue;
            border-radius: 10px;
            border-collapse: collapse;
        }
        td,th{
            border: 2px solid blue;
            text-align: center;
            padding: 10px;
        }
        
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Emp Code</th>
                <th colspan="2">Emp Name and Title</th>
                <!-- <th>Job Title</th> -->
                <th>Salary(LPA)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>911</td>
                <td>Nishiraj Singh</td>
                <td>Developer</td>
                <td>9.6</td>
            </tr>
            <tr>
                <td>912</td>
                <td>XYZ</td>
                <td>Tester</td>
                <td>2.8</td>
            </tr>
            <tr>
                <td>913</td>
                <td>ABC</td>
                <td>Digita Marketing</td>
                <td>5.2</td>
            </tr>
            <tr>
                <td>914</td>
                <td>PQR</td>
                <td>Developer</td>
                <td>4</td>
            </tr>
            <tr>
                <td>915</td>
                <td>MNO</td>
                <td>HR</td>
                <td>4.5</td>
            </tr>

        </tbody>
    </table>
</body>
</html>
