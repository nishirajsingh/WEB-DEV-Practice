<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        table,
        th,
        td {
            border: 1px solid ;
            border-collapse: collapse;
            padding: 10px;
        }
        th{
            background-color: black;
            color:white;
        }
    </style>
</head>
<body>
    <div>
        <h1>Student Table</h1>
        <table>
            <thead>
            <tr>
                <th>Sr. No.</th>
                <th>Name</th>
                <th>Course</th>
                <th>CGPA</th>
            </tr>

            <tbody>
            <tr>
                <td>1</td>
                <td>Nishiraj Singh</td>
                <td>B.tech AIML</td>
                <td>7.1</td>
            </tr>
            <tr>
                <td>2</td>
                <td>XYZ</td>
                <td>B.tech CSE</td>
                <td>8.0</td>
            </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
